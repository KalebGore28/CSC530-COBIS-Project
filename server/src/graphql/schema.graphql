"""
Lookup tables
"""

type AcademicStanding {
  code: String!            # PK
  description: String!
}

type AdmitCode {
  code: String!            # PK
  description: String!
}

type College {
  code: String!            # PK
  description: String!
}

type Department {
  code: String!            # PK
  description: String!
  college: College!         # FK → colleges.code
}

type InstructionalMethod {
  code: String!            # PK
  description: String!
}

type Nation {
  code: String!            # PK
  description: String!
}

type PartOfTerm {
  code: String!            # PK
  description: String!
}

type Course {
  subject: String!         # part of PK
  number: Int!             # part of PK
  suffix: String!          # part of PK
  title: String!
  hours: Int!
  fee: Float!
  web_fee: Float!
  last_updated: String!
}

type Program {
  code: String!            # PK
  description: String!
  cip_code: String
  is_major: Boolean!
  is_minor: Boolean!
  has_concentration: Boolean!
  is_discontinued: Boolean!
  is_aacsb: Boolean!
  department: Department!  # FK → departments.code
  college: College!        # FK → colleges.code
  added_on: String!
}

type RegistrationStatus {
  code: String!            # PK
  description: String!
}

type Role {
  id: Int!                 # PK
  name: String!
}

type Term {
  code: String!            # PK
  description: String!
}

"""
Core entity tables
"""

type User {
  id: ID!                  # PK
  mnumber: String          # unique, FK → students.mnumber or faculty.mnumber
  name: String!
  email: String!
  email_verified: Boolean!
  image: String
  created_at: Int!
  updated_at: Int!
  is_enabled: Boolean!
  last_login: String!
  roles: [Role!]!          # via user_roles
}

type Student {
  mnumber: ID!             # PK, FK → user.mnumber
  first_name: String!
  middle_name: String!
  last_name: String!
  suffix: String!
  gender: String!
  birthdate: String!
  citizenship: String!
  race_code: String!
  race_description: String!
  residency_code: String!
  residency_description: String!
  age: Int!
  cell_phone: String!
  email: String!
  academic_info: [StudentAcademicInfo!]!
  addresses: [StudentAddress!]!
  advisors: [StudentAdvisor!]!
  courses: [StudentCourse!]!
  programs: [StudentProgram!]!
  test_scores: [TestScore!]!
}

type Faculty {
  mnumber: ID!             # PK
  first_name: String!
  last_name: String!
  college: College!         # FK → colleges.code
  department: Department!   # FK → departments.code
  courses_taught: [InstructorCourse!]!
}

"""
Auth & session tables
"""

type Account {
  id: ID!                  # PK
  account_id: String!
  provider_id: String!
  user: User!              # FK → user.id
  access_token: String
  refresh_token: String
  id_token: String
  access_token_expires_at: Int
  refresh_token_expires_at: Int
  scope: String
  password: String
  created_at: Int!
  updated_at: Int!
}

type Session {
  id: ID!                  # PK
  token: String!
  expires_at: Int!
  created_at: Int!
  updated_at: Int!
  ip_address: String
  user_agent: String
  user: User!              # FK → user.id
}

type Verification {
  id: ID!                  # PK
  identifier: String!
  value: String!
  expires_at: Int!
  created_at: Int
  updated_at: Int
}

"""
Relationship tables
"""

type UserRole {
  user: User!              # FK → user.id
  role: Role!              # FK → roles.id
}

"""
Student-related tables
"""

type StudentAcademicInfo {
  mnumber: String!         # FK → students.mnumber
  student: Student!
  term: Term!
  year: Int!
  admit_term: Term!
  admit_year: Int!
  admit_code: AdmitCode!
  academic_standing: AcademicStanding!
  msu_attempted_hours: Float!
  msu_earned_hours: Float!
  msu_quality_points: Float!
  msu_gpa: Float!
  overall_attempted_hours: Float!
  overall_earned_hours: Float!
  overall_quality_points: Float!
  overall_gpa: Float!
}

type StudentAddress {
  mnumber: String!         # FK → students.mnumber
  student: Student!
  type: String!
  street1: String!
  street2: String
  city: String!
  state: String!
  zip: String!
  nation_code: Nation!
  phone: String!
}

type StudentAdvisor {
  student_mnumber: String! # FK → students.mnumber
  student: Student!
  term: Term!
  year: Int!
  advisor_mnumber: String! # FK → faculty.mnumber
  advisor: Faculty!
}

type StudentCourse {
  mnumber: String!         # FK → students.mnumber
  student: Student!
  term: Term!
  year: Int!
  part_of_term: PartOfTerm!
  crn: String!
  course: Course!
  course_section: String!
  course_hours: Int!
  course_level: String!
  registration_status: RegistrationStatus!
  instructional_method: InstructionalMethod!
  last_attendance: String
  midterm_grade: String
  final_grade: String
}

type StudentProgram {
  mnumber: String!         # FK → students.mnumber
  student: Student!
  term: Term!
  year: Int!
  type: String!
  level: String!
  program: Program!
}

type TestScore {
  mnumber: Student!         # FK → students.mnumber
  student: Student!
  code: String!
  description: String!
  score: Float!
  date: String!
}

"""
Instructor courses
"""

type InstructorCourse {
  mnumber: Faculty!         # FK → user.mnumber
  term: Term!
  year: Int!
  crn: String!
  course: Course!
  role: String!
}

# Root query type

type Query {
  student(mnumber: String!): Student
  faculty(mnumber: String!): Faculty
  user(id: ID!): User
  course(subject: String!, number: Int!, suffix: String!): Course
  program(code: String!): Program
  department(code: String!): Department
  college(code: String!): College
  term(code: String!): Term
}
