<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>GraphQL Playground</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>

    <body>
        <script type="module">
            import { renderPlaygroundPage } from 'https://cdn.jsdelivr.net/npm/graphql-playground-html@1.6.30/+esm'

            // Overwrite the entire HTML with Playground’s full document
            document.open()
            document.write(
                renderPlaygroundPage({
                    endpoint: '/api/graphql',
                    settings: {
                        'editor.theme': 'dark',
                        'request.credentials': 'same-origin',
                    },
                }),
            )
            document.close()
        </script>
    </body>
</html>
