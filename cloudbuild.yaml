      - 'VITE_FRONTEND_URL=$_VITE_FRONTEND_URL'
      - 'VITE_GRAPHQL_HTTP_ENDPOINT=$_VITE_GRAPHQL_HTTP_ENDPOINT'
images:
  - 'gcr.io/$PROJECT_ID/cobis-app'