steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'gcr.io/$PROJECT_ID/cobis-app',
        '--build-arg=VITE_GRAPHQL_HTTP_ENDPOINT=$_VITE_GRAPHQL_HTTP_ENDPOINT',
        '.'
      ]
# push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cobis-app']
images:
  - 'gcr.io/$PROJECT_ID/cobis-app'